<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSC 代币关联地址分析 (无依赖版)</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #151515;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --muted: #999;
      --gold: #daa520;
      --red: #c41e1e;
      --green: #2e7d32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Noto Sans SC', sans-serif;
      display: flex; justify-content: center; padding: 40px 16px;
      line-height: 1.6;
    }
    .container { max-width: 700px; width: 100%; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px;
    }
    h2 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
    input, textarea {
      width: 100%; padding: 12px; background: #111;
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: monospace; font-size: 13px;
      margin-bottom: 18px; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    textarea { height: 80px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #b71c1c, #d32f2f);
      border: none; border-radius: 10px; color: white; font-weight: 700;
      font-size: 15px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; transition: transform .2s, box-shadow .2s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(196,30,30,0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px;
      display: flex; align-items: center; gap: 8px; font-weight: 500;
    }
    .status.info { background: rgba(218,165,32,0.1); border:1px solid rgba(218,165,32,0.3); color:var(--gold); }
    .status.error { background: rgba(211,47,47,0.1); border:1px solid rgba(211,47,47,0.25); color:#ef5350; }
    .status.success { background: rgba(46,125,50,0.1); border:1px solid rgba(46,125,50,0.3); color:#66bb6a; }
    .result {
      background: #0f0f0f; border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; margin-top: 20px; white-space: pre-wrap; word-break: break-word;
      font-family: monospace; font-size: 13px; line-height: 1.7; max-height: 500px;
      overflow-y: auto; color: #ccc;
    }
    .gold { color: var(--gold); font-weight: 700; }
    .red { color: #ef5350; font-weight: 700; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>🔍 代币关联地址扫描</h2>
      <p class="sub">
        无需 ethers.js，纯浏览器请求 BSC RPC 节点。<br>
        输入合约地址，扫描 Transfer 日志，锁定交互最频繁的钱包。
      </p>

      <label>📌 合约地址 (BSC)</label>
      <input type="text" id="contract" placeholder="0x...">

      <div class="row">
        <div class="field">
          <label>🔹 起始区块 (留空=0)</label>
          <input type="number" id="fromBlock" placeholder="0">
        </div>
        <div class="field">
          <label>🔹 结束区块 (留空=最新)</label>
          <input type="number" id="toBlock" placeholder="latest">
        </div>
      </div>

      <label style="margin-top:4px;">🧬 合约 ABI (可选，本工具暂不解析，仅做记录)</label>
      <textarea id="abi" placeholder='[{"constant":true,"inputs":[],"name":"owner",...}]'></textarea>

      <button id="scanBtn">🔎 开始扫描</button>

      <div id="status"></div>
      <div id="result" class="result" style="display:none;"></div>
    </div>
  </div>

  <script>
    (function() {
      const contractInput = document.getElementById('contract');
      const fromInput = document.getElementById('fromBlock');
      const toInput = document.getElementById('toBlock');
      const scanBtn = document.getElementById('scanBtn');
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      const RPC_URL = 'https://bsc-dataseed1.binance.org/';
      // Transfer 事件签名 keccak256("Transfer(address,address,uint256)")
      const TRANSFER_TOPIC = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';

      // 简单的状态展示
      function setStatus(type, msg) {
        statusDiv.innerHTML = `<div class="status ${type}">${msg}</div>`;
      }

      function showResult(text) {
        resultDiv.textContent = text;
        resultDiv.style.display = 'block';
      }

      function hideResult() {
        resultDiv.style.display = 'none';
      }

      // JSON-RPC 请求
      async function rpc(method, params) {
        const res = await fetch(RPC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', method, params, id: 1 })
        });
        if (!res.ok) throw new Error('RPC HTTP ' + res.status);
        const json = await res.json();
        if (json.error) throw new Error(json.error.message || 'RPC error');
        return json.result;
      }

      // 验证 BSC 地址
      function isValidAddress(addr) {
        return /^0x[0-9a-fA-F]{40}$/.test(addr);
      }

      scanBtn.addEventListener('click', async () => {
        hideResult();
        statusDiv.innerHTML = '';
        const contractAddr = contractInput.value.trim();

        // 1. 检查地址
        if (!contractAddr) {
          setStatus('error', '❌ 请输入合约地址');
          return;
        }
        if (!isValidAddress(contractAddr)) {
          setStatus('error', '❌ 无效的合约地址 (需要 0x 开头的 40 位 hex)');
          return;
        }

        scanBtn.disabled = true;
        scanBtn.innerHTML = '⏳ 扫描中...';

        try {
          // 2. 获取当前区块
          setStatus('info', '📡 连接 BSC 节点...');
          const latestBlock = await rpc('eth_blockNumber');
          const currentBlock = parseInt(latestBlock, 16);

          let fromBlock = fromInput.value ? parseInt(fromInput.value) : 0;
          let toBlock = toInput.value ? parseInt(toInput.value) : currentBlock;

          if (isNaN(fromBlock)) fromBlock = 0;
          if (isNaN(toBlock)) toBlock = currentBlock;
          if (fromBlock < 0) fromBlock = 0;
          if (toBlock > currentBlock) toBlock = currentBlock;
          if (fromBlock > toBlock) {
            setStatus('error', '❌ 起始区块不能大于结束区块');
            scanBtn.disabled = false;
            scanBtn.innerHTML = '🔎 开始扫描';
            return;
          }

          setStatus('info', `📦 正在扫描区块 ${fromBlock} 至 ${toBlock} (共 ${toBlock - fromBlock} 个区块)...`);

          // 3. 调用 eth_getLogs (注意：单次最多返回 1000 条日志，我们只请求一次，若超出需缩小范围)
          const params = {
            address: contractAddr,
            topics: [TRANSFER_TOPIC],
            fromBlock: '0x' + fromBlock.toString(16),
            toBlock: '0x' + toBlock.toString(16)
          };

          let logs;
          try {
            logs = await rpc('eth_getLogs', [params]);
          } catch (e) {
            if (e.message.includes('query returned more than 10000 results')) {
              setStatus('error', '❌ 查询范围过大，返回超过 10000 条记录。请缩小区块范围（例如每次扫描 10 万个区块）');
            } else {
              setStatus('error', '❌ 获取日志失败: ' + e.message);
            }
            scanBtn.disabled = false;
            scanBtn.innerHTML = '🔎 开始扫描';
            return;
          }

          if (!logs || logs.length === 0) {
            setStatus('success', '✅ 扫描完成，但在指定范围内未发现任何 Transfer 事件');
            showResult('📭 该合约在所选区块范围内没有发生过转账。');
            scanBtn.disabled = false;
            scanBtn.innerHTML = '🔎 开始扫描';
            return;
          }

          setStatus('info', `✅ 获取到 ${logs.length} 条转账记录，正在统计地址...`);

          // 4. 解析日志，统计地址出现次数
          const addressCount = new Map();
          logs.forEach(log => {
            try {
              // topic[1] 是 from，topic[2] 是 to
              const fromTopic = log.topics[1];
              const toTopic = log.topics[2];
              if (fromTopic && fromTopic.length >= 66) {
                const from = '0x' + fromTopic.slice(26); // 取后 40 个字符
                addressCount.set(from, (addressCount.get(from) || 0) + 1);
              }
              if (toTopic && toTopic.length >= 66) {
                const to = '0x' + toTopic.slice(26);
                addressCount.set(to, (addressCount.get(to) || 0) + 1);
              }
            } catch (e) { /* 忽略个别解析错误 */ }
          });

          if (addressCount.size === 0) {
            setStatus('success', '⚠️ 没有提取到有效地址');
            showResult('日志解析后未发现地址，可能为异常合约。');
            scanBtn.disabled = false;
            scanBtn.innerHTML = '🔎 开始扫描';
            return;
          }

          // 排序
          const sorted = [...addressCount.entries()].sort((a, b) => b[1] - a[1]);
          const topN = Math.min(10, sorted.length);

          let report = `🔎 共发现 ${sorted.length} 个关联地址 (去重)\n`;
          report += `📊 交互次数 Top ${topN}:\n`;
          for (let i = 0; i < topN; i++) {
            const [addr, count] = sorted[i];
            report += `${i + 1}. ${addr}  (${count} 次)\n`;
          }
          report += `\n💡 交互次数最多的地址为 ${sorted[0][0]}，很可能是合约主要操作地址或 Owner。`;
          report += `\n📋 完整地址列表已输出到浏览器控制台 (F12 → Console)。`;

          console.log('全部关联地址及交互次数:', sorted);

          showResult(report);
          setStatus('success', `✅ 分析完成，共 ${sorted.length} 个关联地址`);

        } catch (err) {
          console.error(err);
          setStatus('error', '❌ 发生错误: ' + (err.message || err));
          hideResult();
        } finally {
          scanBtn.disabled = false;
          scanBtn.innerHTML = '🔎 开始扫描';
        }
      });
    })();
  </script>
</body>
</html>
